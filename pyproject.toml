[project]
name = "transcriber-local"
version = "0.1.0"
description = "Local WhisperX transcription launcher"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "sentencepiece",
    "sacremoses",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
transcriber = "transcriber.__main__:main"
transcriber-server = "transcriber.server:main"

[tool.setuptools.packages.find]
include = ["transcriber*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

